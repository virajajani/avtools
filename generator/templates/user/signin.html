{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in | AVTools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh;
  padding:40px 20px;
  position:relative;
  overflow-y:auto;
}

body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity:0.4;
  z-index:0;
}

.auth-container{
  position:relative;
  z-index:1;
  width:100%;
  max-width:480px;
  margin:0 auto;
}

.auth-card{
  background:rgba(255,255,255,0.98);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:40px;
  box-shadow:0 30px 80px rgba(0,0,0,0.15);
  border:1px solid rgba(255,255,255,0.5);
  animation:slideUp 0.6s ease;
}

@keyframes slideUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

.logo{
  display:flex;
  justify-content:center;
  margin-bottom:24px;
}

.logo img{height:50px;}

h1{
  text-align:center;
  font-size:26px;
  font-weight:800;
  margin-bottom:6px;
  color:#1e293b;
}

.subtitle{
  text-align:center;
  font-size:14px;
  color:#64748b;
  margin-bottom:24px;
}

.divider{
  display:flex;
  align-items:center;
  margin:20px 0;
  color:#94a3b8;
  font-size:13px;
  font-weight:500;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,#e2e8f0,transparent);
}

.divider span{margin:0 14px;}

.form-group{margin-bottom:16px;}

label{
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  display:block;
  color:#334155;
}

input{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:2px solid #e2e8f0;
  font-size:14px;
  transition:all 0.3s ease;
  background:#fff;
  color:#1e293b;
}

input:focus{
  outline:none;
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.1);
}

input::placeholder{color:#94a3b8;}

.forgot-password{
  text-align:right;
  margin-top:-10px;
  margin-bottom:18px;
}

.forgot-password a{
  color:#3b82f6;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
}

.forgot-password a:hover{color:#2563eb;}

.btn-primary{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s ease;
  box-shadow:0 8px 24px rgba(59,130,246,0.3);
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(59,130,246,0.4);
}

.footer-text{
  text-align:center;
  margin-top:20px;
  font-size:14px;
  color:#64748b;
}

.footer-text a{
  color:#3b82f6;
  text-decoration:none;
  font-weight:700;
}

.footer-text a:hover{color:#2563eb;}

.msg{
  padding:12px 14px;
  border-radius:12px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:700;
  text-align:center;
}

.msg-error{
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
}

.msg-success{
  background:#dcfce7;
  color:#166534;
  border:1px solid #bbf7d0;
}
</style>
</head>

<body>

<div class="auth-container">
  <div class="auth-card">

    <div class="logo">
      <img src="{% static 'images/avtools.png' %}" alt="AVTools Logo">
    </div>

    <h1>Welcome back!</h1>
    <p class="subtitle">Sign in to continue to your account</p>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags == 'success' %}msg-success{% else %}msg-error{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <div class="divider"><span>Sign in with email</span></div>

   <form method="POST" action="{% url 'generator:signin' %}">
  {% csrf_token %}
      <div class="form-group">
        <label>Email address</label>
        <input name="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input name="password" type="password" placeholder="Enter your password" required>
      </div>

      <div class="forgot-password">
        <a href="{% url 'generator:forgot_password' %}">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Sign in →</button>
    </form>

    <p class="footer-text">
      Don't have an account? <a href="{% url 'generator:signup' %}">Create account</a>
    </p>

  </div>
</div>
<script>
const loginForm = document.getElementById("loginForm");
const loginPassword = document.getElementById("loginPassword");
const passwordError = document.getElementById("passwordError");

function showPasswordError(message) {
  passwordError.innerText = message;
  passwordError.style.display = "block";
  loginPassword.classList.add("input-error");
}

function clearPasswordError() {
  passwordError.innerText = "";
  passwordError.style.display = "none";
  loginPassword.classList.remove("input-error");
}

loginPassword.addEventListener("input", clearPasswordError);

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearPasswordError();

  const formData = new FormData(loginForm);

  try {
    const res = await fetch(loginForm.action, {
      method: "POST",
      body: formData,
      headers: {
        "X-Requested-With": "XMLHttpRequest"
      }
    });

    // ✅ If login success Django will redirect (302)
    if (res.redirected) {
      window.location.href = res.url;
      return;
    }

    // ✅ If response is normal HTML with error
    const html = await res.text();

    // Very simple check: if "Invalid" exists show error
    if (html.includes("Invalid")) {
      showPasswordError("Email or password is incorrect");
    } else {
      // fallback
      showPasswordError("Login failed. Please try again.");
    }

  } catch (err) {
    showPasswordError("Server error. Please try again.");
  }
});
</script>

</body>
</html>
