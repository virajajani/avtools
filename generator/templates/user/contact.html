<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Support – AVTools</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --primary:#3b82f6;
  --primary-dark:#2563eb;
  --text:#1e293b;
  --text-light:#64748b;
  --bg:#ffffff;
  --bg-gray:#f8fafc;
  --border:#e2e8f0;
}

body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg-gray);
}

/* ================= HEADER ================= */
.navbar{
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo img{
  height:36px;
}

.nav-links{
  display:flex;
  gap:28px;
  align-items:center;
}

.nav-links a{
  text-decoration:none;
  color:var(--text);
  font-weight:500;
  font-size:15px;
}

.nav-links a:hover{
  color:var(--primary);
}

.btn{
  padding:10px 22px;
  border-radius:10px;
  font-weight:600;
  text-decoration:none;
  font-size:14px;
}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
}

/* ================= CONTACT FORM ================= */
.container{
  max-width:700px;
  margin:80px auto;
  background:#fff;
  padding:50px;
  border-radius:20px;
  border:1px solid var(--border);
}

h1{
  font-size:36px;
  margin-bottom:10px;
}

p{
  color:var(--text-light);
  margin-bottom:30px;
}

.form-group{
  margin-bottom:20px;
}

label{
  font-weight:600;
  display:block;
  margin-bottom:6px;
}

input, textarea{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:15px;
}

textarea{
  resize:none;
  height:120px;
}

/* ================= BUTTON + LOADER ================= */
.submit-btn{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  border:none;
  padding:14px 28px;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.submit-btn:disabled{
  opacity:0.8;
  cursor:not-allowed;
}

.loader{
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,0.4);
  border-top:3px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:none;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* ================= FOOTER ================= */
.footer{
  background:#1e293b;
  color:rgba(255,255,255,0.7);
  padding:40px 6%;
  margin-top:100px;
}

.footer-content{
  max-width:1200px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
}

.footer-links{
  display:flex;
  gap:24px;
}

.footer-links a{
  color:rgba(255,255,255,0.7);
  text-decoration:none;
}

.footer-links a:hover{
  color:#fff;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
  .nav-links{display:none;}
  .container{
    margin:50px 16px;
    padding:40px 24px;
  }
  .footer-content{
    flex-direction:column;
    text-align:center;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<nav class="navbar">
  <div class="logo">
    <a href="/"><img src="/static/images/avtools.png" alt="AVTools"></a>
  </div>
  <div class="nav-links">
    <a href="/#features">Features</a>
    <a href="/#pricing">Pricing</a>
    <a href="/contact">Contact</a>
    <a href="/signin">Login</a>
    <a href="/signup" class="btn btn-primary" style="color:#fff">Get Started</a>
  </div>
</nav>

<!-- CONTACT FORM -->
<div class="container">
  <h1>Contact Support</h1>
  <p>Need help? Send us a message and our team will get back to you.</p>

  <form method="POST" onsubmit="handleSubmit()">
    {% csrf_token %}

    <div class="form-group">
      <label>First Name</label>
      <input type="text" name="first_name" required>
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input type="text" name="last_name">
    </div>

    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" name="mobile">
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" required>
    </div>

    <div class="form-group">
      <label>Message</label>
      <textarea name="message" required></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      <span id="btnText">Send Message</span>
      <span class="loader" id="loader"></span>
    </button>
  </form>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-content">
    <div>© 2026 AVTools. All rights reserved.</div>
    <div class="footer-links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="/contact">Contact</a>
    </div>
  </div>
</footer>

<script>
function handleSubmit(){
  const btn = document.getElementById("submitBtn");
  document.getElementById("btnText").innerText = "Sending...";
  document.getElementById("loader").style.display = "inline-block";
  btn.disabled = true;
}
</script>

</body>
</html>
